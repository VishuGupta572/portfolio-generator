spring.application.name=demo
server.port=8056

spring.datasource.url=jdbc:mysql://localhost:3306/profiles
spring.datasource.username=root
spring.datasource.password=NewPassword@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Google Gemini API Configuration (via OpenAI-compatible endpoint)
spring.ai.openai.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Gemini OpenAI-compatible base URL:
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/

# Gemini Model:
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite



